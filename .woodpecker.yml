# Zwei Auslieferungen aus zwei Zweigen:
#   main      -> hub.rpi-virtuell.net (tägliche Vorschau)
#   released  -> relihub.net (öffentliche Seite, nur bewusst Freigegebenes)
# Jeder Zweig hat eigene Secrets im Woodpecker. Einzelheiten: docs/betrieb.md

when:
  - event: push
    branch: [main, released]

steps:
  - name: deploy-vorschau
    image: appleboy/drone-ssh
    when:
      - branch: main
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_key
      script:
        from_secret: deploy_script

  - name: deploy-released
    image: appleboy/drone-ssh
    when:
      - branch: released
    settings:
      host:
        from_secret: deploy_host_released
      username:
        from_secret: deploy_user_released
      key:
        from_secret: deploy_key_released
      script:
        from_secret: deploy_script_released
