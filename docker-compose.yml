# Hub-Fassung (Comenius-Institut/hub): ersetzt Steffens Traefik-Compose. Ludgers deploy-app.sh baut
# das Image aus dem Dockerfile mit Podman (Materialpool-Entwicklung/docs/betrieb.md). Die .env liegt
# neben dieser Datei, außerhalb von git (Vorlage: hub.env.example). Host-Port 8081, weil 8080 auf
# demselben Host der Materialpool ist.
services:
  hub:
    build: .
    restart: unless-stopped
    ports:
      - '8081:3000'
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
